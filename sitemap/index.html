<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NAC Sitemap — Interactive Site Map</title>
<meta name="robots" content="noindex"/>
<style>
  :root{
    --blue:#1800AD; --blue-2:#2A1FD9; --orange:#F4622A; --orange-2:#FF9F1C;
    --ink:#13131a; --sub:#6b7280; --line:#e6e8ef; --bg:#f5f6fb; --card:#ffffff;
    --green:#16a34a; --good:#16a34a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}
  a{color:inherit}
  /* ---------- top bar ---------- */
  header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
         padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:17px;font-weight:800;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--sub)}
  .grow{flex:1}
  .search{position:relative}
  .search input{width:280px;max-width:48vw;padding:9px 34px 9px 34px;border:1px solid var(--line);
                border-radius:10px;font-size:13.5px;outline:none;background:#fbfbfe}
  .search input:focus{border-color:var(--blue)}
  .search .ic{position:absolute;left:10px;top:9px;color:var(--sub);font-size:14px}
  .search .clr{position:absolute;right:8px;top:6px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:16px;display:none}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f3f4fb}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub)}
  .seg button.active{background:var(--blue);color:#fff}
  .seg button.active.orange{background:var(--orange)}
  /* ---------- hero cards ---------- */
  .heros{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px 20px 4px}
  .hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;min-height:150px;
        box-shadow:0 10px 30px rgba(20,20,40,.10);border:1px solid rgba(255,255,255,.4)}
  .hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.30}
  .hero .grad{position:absolute;inset:0}
  .hero.main .grad{background:linear-gradient(135deg,#1800AD 0%,#3a1fd9 60%,#5a23c4 100%)}
  .hero.blog .grad{background:linear-gradient(135deg,#F4622A 0%,#ff7a3d 55%,#FF9F1C 100%)}
  .hero .body{position:relative;padding:18px 20px;display:flex;flex-direction:column;height:100%}
  .hero h2{margin:0;font-size:19px;font-weight:800}
  .hero .u{font-size:12.5px;opacity:.92;margin-top:2px}
  .hero .desc{font-size:12.5px;opacity:.92;margin-top:8px;max-width:90%}
  .hero .stats{margin-top:auto;display:flex;gap:18px;padding-top:14px}
  .hero .stat b{font-size:22px;font-weight:800;display:block}
  .hero .stat span{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
  .hero .open{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);
              color:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;text-decoration:none;backdrop-filter:blur(3px)}
  .hero .open:hover{background:rgba(255,255,255,.30)}
  /* ---------- legend / toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap;color:var(--sub);font-size:12.5px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* ---------- tree ---------- */
  .wrap{padding:4px 20px 60px}
  .tree{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;
        box-shadow:0 6px 20px rgba(20,20,40,.04)}
  ul.t{list-style:none;margin:0;padding-left:0}
  ul.t ul.t{padding-left:20px;border-left:1px dashed #d6d9e6;margin-left:14px}
  li.row{margin:1px 0}
  .node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;cursor:default;position:relative}
  .node:hover{background:#f3f4fb}
  .twist{width:18px;height:18px;flex:none;display:inline-flex;align-items:center;justify-content:center;
         border-radius:6px;cursor:pointer;color:var(--sub);font-size:11px;user-select:none}
  .twist.has:hover{background:#e7e9f5;color:var(--blue)}
  .twist.leaf{visibility:hidden}
  .lbl{font-size:13.5px;font-weight:600;white-space:nowrap}
  .lbl.sec{font-weight:800}
  .badge{font-size:10.5px;font-weight:800;color:#fff;border-radius:999px;padding:1px 8px;background:var(--sub)}
  .open-link{font-size:11px;color:var(--blue);text-decoration:none;opacity:0;transition:opacity .1s;margin-left:2px;white-space:nowrap}
  .node:hover .open-link{opacity:1}
  .lm{font-size:11px;color:#9aa0ac;margin-left:4px;opacity:0}
  .node:hover .lm{opacity:1}
  .hit{background:#fff4e6 !important;box-shadow:inset 0 0 0 1px var(--orange-2)}
  .hide{display:none !important}
  /* parents-only mode: hide end-page leaf rows (toggle re-shows them) */
  body.parents-only li.leafrow{display:none}
  .seg.small button{padding:7px 12px;font-size:12.5px}
  .count-note{padding:8px 14px;color:var(--sub);font-size:12.5px}
  footer{padding:18px 20px;color:#9aa0ac;font-size:12px;text-align:center}
  .lbl.click{cursor:pointer}
  .lbl.click:hover{text-decoration:underline;text-decoration-color:#c9cde0}
  .peek{font-size:11px;color:var(--sub);margin-left:2px;opacity:0;transition:opacity .1s}
  .node:hover .peek{opacity:.8}
  /* ---------- Miro-style expanded card ---------- */
  .scrim{position:fixed;inset:0;background:rgba(18,18,32,.46);backdrop-filter:blur(2px);
         z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .scrim.open{display:flex}
  .card{width:560px;max-width:94vw;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;
        box-shadow:0 30px 80px rgba(10,10,30,.45);border:1px solid var(--line);
        transform:translateY(8px) scale(.98);opacity:0;transition:transform .16s ease,opacity .16s ease}
  .scrim.open .card{transform:none;opacity:1}
  .card .shot{position:relative;height:300px;background:#0f1320;border-radius:18px 18px 0 0;overflow:hidden}
  .card .shot img,.card .shot iframe{width:100%;height:100%;border:0;display:block;object-fit:cover;object-position:top center}
  .card .shot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
                  color:#aab;background:linear-gradient(135deg,#1a1d2e,#23263b);gap:10px;font-size:13px}
  .card .shot .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .card .shot .tagsite{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;color:#fff;
                       background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px}
  .card .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.4);
           background:rgba(0,0,0,.4);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .card .x:hover{background:rgba(0,0,0,.6)}
  .card .body{padding:16px 18px 18px}
  .card h3{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.25}
  .card .crumb{font-size:12px;color:var(--sub);word-break:break-all;margin-bottom:12px}
  .card .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .card .chip{font-size:11px;font-weight:700;color:#374151;background:#eef0f6;border-radius:999px;padding:4px 11px}
  .card .actions{display:flex;gap:9px;flex-wrap:wrap}
  .card .actions a,.card .actions button{font-size:13px;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .card .actions a.go{background:var(--blue);color:#fff;border-color:var(--blue)}
  .card .actions a.go.orange{background:var(--orange);border-color:var(--orange)}
  .card .actions button:hover,.card .actions a:not(.go):hover{background:#f3f4fb}
  @media(max-width:760px){.heros{grid-template-columns:1fr}.search input{width:160px}.card .shot{height:220px}}
</style>
</head>
<body class="parents-only">
<header>
  <div class="brand"><b>NAC Sitemap</b><span id="genline">Interactive site map</span></div>
  <div class="seg" id="siteSeg">
    <button data-site="all" class="active">Both</button>
    <button data-site="main">Main</button>
    <button data-site="blog" >Blog</button>
  </div>
  <div class="search">
    <span class="ic">🔍</span>
    <input id="q" type="text" placeholder="Search pages, posts, countries…" autocomplete="off"/>
    <button class="clr" id="clr">×</button>
  </div>
  <div class="grow"></div>
  <div class="seg small" id="depthSeg">
    <button data-depth="parents" class="active">Parents only</button>
    <button data-depth="pages">Show pages</button>
  </div>
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="collapse">Collapse</button>
</header>

<div class="heros" id="heros"></div>

<div class="toolbar">
  <span id="matchinfo"></span>
  <span class="legend">
    <span><i class="dot" style="background:#1800AD"></i>Main site</span>
    <span><i class="dot" style="background:#F4622A"></i>Blog</span>
    <span><i class="dot" style="background:#16a34a"></i>section / hub</span>
    <span>click a row's <b style="color:#1800AD">open ↗</b> to visit the live page</span>
  </span>
</div>

<div class="wrap"><div class="tree" id="tree"></div></div>
<footer id="foot"></footer>

<!-- Miro-style expanded preview card -->
<div class="scrim" id="scrim">
  <div class="card" id="card" role="dialog" aria-modal="true">
    <div class="shot" id="cardShot"></div>
    <div class="body">
      <h3 id="cardTitle"></h3>
      <div class="crumb" id="cardCrumb"></div>
      <div class="meta" id="cardMeta"></div>
      <div class="actions" id="cardActions"></div>
    </div>
  </div>
</div>

<script id="data" type="application/json">{"generated":"2026-08-02","sites":[{"id":"main","title":"nomadassetcollective.com","subtitle":"Main site · WordPress · Vietnamese","color":"#1800AD","total":0,"children":[]},{"id":"blog","title":"blog.nomadassetcollective.com","subtitle":"NAC Times · editorial","color":"#F4622A","masthead":"https://blog.nomadassetcollective.com/wp-content/uploads/2026/05/Masthead.png","total":0,"children":[]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const COLORS = {main:'#1800AD', blog:'#F4622A'};

document.getElementById('genline').textContent =
  'Snapshot ' + DATA.generated + ' · rebuilt from live sitemap_index.xml (both sites)';

/* ---------- hero cards ---------- */
function hero(site){
  const c = site.color;
  const bg = site.masthead ? `<div class="bg" style="background-image:url('${site.masthead}')"></div>` : '';
  return `<div class="hero ${site.id}">
    ${bg}<div class="grad"></div>
    <a class="open" href="https://${site.title}" target="_blank" rel="noopener">open ↗</a>
    <div class="body">
      <h2>${site.title}</h2>
      <div class="u">${site.subtitle}</div>
      <div class="stats">
        <div class="stat"><b>${site.total}</b><span>URLs mapped</span></div>
        <div class="stat"><b>${site.children.length}</b><span>top sections</span></div>
        <div class="stat"><b>${countLeaves(site.children)}</b><span>leaf pages</span></div>
      </div>
    </div></div>`;
}
function countLeaves(nodes){let n=0;(function w(a){a.forEach(x=>{if(!x.children||!x.children.length)n++;else w(x.children)})})(nodes);return n;}
document.getElementById('heros').innerHTML = DATA.sites.map(hero).join('');

/* ---------- tree render ---------- */
let curSite = 'all';
function sectionColor(site){return COLORS[site];}

function renderNode(node, siteId, depth){
  const has = node.children && node.children.length;
  const li = document.createElement('li');
  li.className = 'row';
  const node_div = document.createElement('div');
  node_div.className = 'node';

  const tw = document.createElement('span');
  tw.className = 'twist ' + (has ? 'has' : 'leaf');
  tw.textContent = has ? '▶' : '•';
  node_div.appendChild(tw);

  const lbl = document.createElement('span');
  lbl.className = 'lbl' + (depth<=1 ? ' sec' : '');
  lbl.textContent = node.name;
  node_div.appendChild(lbl);

  if (has){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = node.children.length;
    if (depth<=1) b.style.background = depth===0 ? sectionColor(siteId) : '#16a34a';
    node_div.appendChild(b);
  }
  if (node.loc){
    const peek = document.createElement('span');
    peek.className='peek'; peek.textContent='👁 preview';
    peek.style.cursor='pointer';
    peek.addEventListener('click', e=>{e.stopPropagation(); openCard(node, siteId);});
    node_div.appendChild(peek);
    const a = document.createElement('a');
    a.className='open-link'; a.href=node.loc; a.target='_blank'; a.rel='noopener';
    a.textContent='open ↗';
    node_div.appendChild(a);
  }
  if (node.lm){
    const t=document.createElement('span'); t.className='lm'; t.textContent=node.lm;
    node_div.appendChild(t);
  }
  li.appendChild(node_div);

  if (has){
    const ul = document.createElement('ul');
    ul.className='t hide';                       // collapsed by default
    node.children.forEach(ch => ul.appendChild(renderNode(ch, siteId, depth+1)));
    li.appendChild(ul);
    const toggle = ()=>{const open=!ul.classList.contains('hide');
      ul.classList.toggle('hide'); tw.textContent = open?'▶':'▼';};
    tw.addEventListener('click', toggle);
    lbl.style.cursor='pointer';
    lbl.addEventListener('click', toggle);
  } else if (node.loc){
    // leaf with a real URL → clicking the label opens the preview card
    lbl.classList.add('click');
    lbl.addEventListener('click', ()=> openCard(node, siteId));
    // end-pages (PDPs, posts, brochures, citizenships…) are hidden in "parents only" mode;
    // top-level standalone pages (depth 0) always stay.
    if (depth >= 1) li.classList.add('leafrow');
  }
  return li;
}

/* ---------- Miro-style preview card ---------- */
function shotURL(loc, w, h){
  return 'https://s0.wp.com/mshots/v1/' + encodeURIComponent(loc) + '?w='+w+'&h='+h;
}
function openCard(node, siteId){
  const site = DATA.sites.find(s=>s.id===siteId) || {};
  const scrim=document.getElementById('scrim');
  const shot=document.getElementById('cardShot');
  document.getElementById('cardTitle').textContent = node.name;
  document.getElementById('cardCrumb').textContent = node.loc;
  // meta chips
  const meta=document.getElementById('cardMeta'); meta.innerHTML='';
  const chips=[ (siteId==='blog'?'NAC Times · blog':'Main site'),
                node.lm ? ('updated '+node.lm) : null,
                (node.children&&node.children.length)?(node.children.length+' children'):'leaf page' ].filter(Boolean);
  chips.forEach(c=>{const s=document.createElement('span');s.className='chip';s.textContent=c;meta.appendChild(s);});
  // actions
  const act=document.getElementById('cardActions');
  const orange = siteId==='blog' ? ' orange' : '';
  act.innerHTML =
    '<a class="go'+orange+'" href="'+node.loc+'" target="_blank" rel="noopener">Open live ↗</a>'+
    '<button id="btnLive">Live embed</button>'+
    '<button id="btnReload">↻ Re-render shot</button>';
  // screenshot (mshots renders async → retry a few times, then offer live iframe)
  shot.innerHTML =
    '<span class="tagsite" style="background:'+(site.color||'#000')+'cc">'+(site.title||'')+'</span>'+
    '<button class="x" id="cardX" title="Close (Esc)">×</button>'+
    '<div class="ph"><div class="spin"></div><div>rendering snapshot…</div></div>'+
    '<img id="cardImg" alt="" style="opacity:0">';
  loadShot(node.loc);
  document.getElementById('cardX').onclick=closeCard;
  document.getElementById('btnReload').onclick=()=>loadShot(node.loc, true);
  document.getElementById('btnLive').onclick=()=>{
    shot.innerHTML='<span class="tagsite" style="background:'+(site.color||'#000')+'cc">live</span>'+
      '<iframe src="'+node.loc+'" loading="lazy" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>';
  };
  scrim.classList.add('open');
}
let shotTries=0, shotTimer=null;
function loadShot(loc, bust){
  const img=document.getElementById('cardImg'); if(!img) return;
  const ph=document.querySelector('#cardShot .ph');
  shotTries=0; clearTimeout(shotTimer);
  const base=shotURL(loc, 1120, 600);
  const tryLoad=()=>{
    shotTries++;
    const u=base + (bust?('&r='+Date.now()):'') + (shotTries>1?('&n='+shotTries):'');
    const probe=new Image();
    probe.onload=()=>{
      // mshots serves a tiny grey placeholder while generating; real shots are larger
      if(probe.naturalWidth>=400 || shotTries>=6){
        img.src=u; img.style.opacity=1; if(ph)ph.style.display='none';
      } else { shotTimer=setTimeout(tryLoad, 2500); }
    };
    probe.onerror=()=>{ if(shotTries<6) shotTimer=setTimeout(tryLoad,2500);
      else if(ph) ph.innerHTML='snapshot unavailable — use “Live embed”'; };
    probe.src=u;
  };
  tryLoad();
}
function closeCard(){document.getElementById('scrim').classList.remove('open');
  clearTimeout(shotTimer);}
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeCard();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();});

function renderTree(){
  const root = document.getElementById('tree');
  root.innerHTML='';
  const sites = DATA.sites.filter(s => curSite==='all' || s.id===curSite);
  sites.forEach(site=>{
    const head=document.createElement('div');
    head.className='count-note';
    head.innerHTML = `<b style="color:${site.color}">● ${site.title}</b> — ${site.total} URLs`;
    root.appendChild(head);
    const ul=document.createElement('ul'); ul.className='t';
    // depth 0 = the site root sections
    site.children.forEach(n=> ul.appendChild(renderNode(n, site.id, 0)));
    root.appendChild(ul);
    // auto-open the first level so structure is visible
    ul.querySelectorAll(':scope > li.row > ul.t').forEach(()=>{});
  });
  // open top-level sections by default
  document.querySelectorAll('#tree > ul.t > li.row > .node > .twist.has').forEach(tw=>{
    const ul = tw.closest('li').querySelector(':scope > ul.t');
    if(ul){ul.classList.remove('hide'); tw.textContent='▼';}
  });
  document.getElementById('foot').textContent =
    'NAC Sitemap · '+DATA.sites.map(s=>s.title+' ('+s.total+')').join('  ·  ')+
    ' · generated '+DATA.generated;
}
renderTree();

/* ---------- site toggle ---------- */
document.querySelectorAll('#siteSeg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#siteSeg button').forEach(x=>x.classList.remove('active','orange'));
    b.classList.add('active'); if(b.dataset.site==='blog') b.classList.add('orange');
    curSite=b.dataset.site; renderTree();
    if(document.getElementById('q').value) runSearch();
  });
});

/* ---------- expand / collapse ---------- */
document.getElementById('expand').addEventListener('click',()=>{
  document.querySelectorAll('#tree ul.t').forEach(u=>u.classList.remove('hide'));
  document.querySelectorAll('#tree .twist.has').forEach(t=>t.textContent='▼');
});
document.getElementById('collapse').addEventListener('click',()=>{
  document.querySelectorAll('#tree ul.t ul.t').forEach(u=>u.classList.add('hide'));
  document.querySelectorAll('#tree ul.t ul.t').forEach(u=>{
    const tw=u.closest('li').querySelector(':scope > .node > .twist.has'); if(tw)tw.textContent='▶';});
  // keep top sections open
  document.querySelectorAll('#tree > ul.t > li.row > ul.t').forEach(u=>u.classList.remove('hide'));
  document.querySelectorAll('#tree > ul.t > li.row > .node > .twist.has').forEach(t=>t.textContent='▼');
});

/* ---------- depth toggle (parents only / show pages) ---------- */
document.querySelectorAll('#depthSeg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#depthSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.classList.toggle('parents-only', b.dataset.depth==='parents');
  });
});

/* ---------- search ---------- */
const q=document.getElementById('q'), clr=document.getElementById('clr'), info=document.getElementById('matchinfo');
function clearSearch(){
  document.querySelectorAll('#tree .row').forEach(r=>r.classList.remove('hide'));
  document.querySelectorAll('#tree .lbl').forEach(l=>l.classList.remove('hit'));
  info.textContent=''; clr.style.display='none';
  // restore whatever the depth toggle had selected
  const onlyParents = document.querySelector('#depthSeg button[data-depth="parents"]').classList.contains('active');
  document.body.classList.toggle('parents-only', onlyParents);
}
function runSearch(){
  const term=q.value.trim().toLowerCase();
  clr.style.display = term?'block':'none';
  if(!term){clearSearch(); return;}
  // while searching, reveal end-pages so leaf matches can surface
  document.body.classList.remove('parents-only');
  let hits=0;
  const rows=[...document.querySelectorAll('#tree li.row')];
  rows.forEach(r=>r.classList.add('hide'));
  document.querySelectorAll('#tree .lbl').forEach(l=>l.classList.remove('hit'));
  rows.forEach(r=>{
    const lbl=r.querySelector(':scope > .node > .lbl');
    if(lbl && lbl.textContent.toLowerCase().includes(term)){
      hits++; lbl.classList.add('hit');
      // reveal this row + all ancestors, and expand the path
      let cur=r;
      while(cur && cur.id!=='tree'){
        if(cur.classList && cur.classList.contains('row')) cur.classList.remove('hide');
        if(cur.tagName==='UL'){cur.classList.remove('hide');
          const tw=cur.closest('li')&&cur.closest('li').querySelector(':scope > .node > .twist.has');
          if(tw)tw.textContent='▼';}
        cur=cur.parentElement;
      }
    }
  });
  info.textContent = hits ? `${hits} match${hits>1?'es':''} for “${q.value}”` : `No matches for “${q.value}”`;
}
q.addEventListener('input', runSearch);
clr.addEventListener('click',()=>{q.value='';clearSearch();q.focus();});
</script>
</body>
</html>
