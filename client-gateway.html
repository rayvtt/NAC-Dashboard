<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAC · Client Gateway</title>
<meta name="description" content="Internal consultant console — every client from first consultation to passport, A to Z.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- GW:ARTIFACT-BEGIN -->
<style>
:root{
  --bg:#060608; --bg-2:#0C0C10; --bg-3:#111118;
  --card:rgba(255,255,255,.028); --card-2:rgba(255,255,255,.05);
  --ink:#F0EDE8; --ink-2:#B7B0A8; --ink-3:#8A8078; --ink-4:#57524C;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05); --line-3:rgba(255,255,255,.14);
  --brand:#1800AD; --brand-2:#4020E0; --brand-ink:#B9AEFF; --brand-faint:rgba(64,32,224,.16);
  --orange:#F4622A; --orange-2:#FF9F1C; --orange-faint:rgba(244,98,42,.12);
  --good:#34D399; --good-faint:rgba(52,211,153,.13);
  --warn:#FCD34D; --warn-faint:rgba(252,211,77,.13);
  --crit:#F87171; --crit-faint:rgba(248,113,113,.13);
  --info:#60A5FA; --info-faint:rgba(96,165,250,.13);
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --sh:0 4px 24px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.05);
  --sh-lg:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.06);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --rail-w:312px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 500px at 82% -8%, rgba(64,32,224,.10), transparent 60%),
    radial-gradient(760px 480px at -6% 4%, rgba(244,98,42,.06), transparent 58%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:rgba(64,32,224,.4);color:#fff}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ── SHELL ── */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}
.topbar{
  grid-column:1/-1; position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:14px 24px; background:rgba(6,6,8,.82); backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(150deg,var(--brand-2),var(--brand) 62%);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 4px 16px rgba(64,32,224,.45),inset 0 1px 0 rgba(255,255,255,.28);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-txt b{font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.brand-txt span{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em}
.top-search{flex:1;max-width:340px;position:relative}
.top-search input{
  width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--ink);
  padding:9px 12px 9px 34px;border-radius:10px;font-size:13px;font-family:inherit;
}
.top-search input::placeholder{color:var(--ink-4)}
.top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.top-stats{display:flex;gap:10px;margin-left:auto}
.tstat{
  padding:6px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line-2);
  display:flex;flex-direction:column;line-height:1.15;min-width:76px;
}
.tstat b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.tstat span{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
  font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line-3);
  background:var(--card-2);color:var(--ink);transition:transform .12s,background .18s,border-color .18s;
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:translateY(1px)}
.btn-accent{background:linear-gradient(140deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(64,32,224,.4)}
.btn-accent:hover{filter:brightness(1.08);background:linear-gradient(140deg,var(--brand-2),var(--brand))}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── RAIL ── */
.rail{
  border-right:1px solid var(--line); background:var(--bg-2);
  min-height:calc(100vh - 61px); padding:16px 12px 40px;
  position:sticky; top:61px; align-self:start; max-height:calc(100vh - 61px); overflow-y:auto;
}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 12px}
.rail-head h2{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-weight:600}
.rail-head b{font-size:11px;color:var(--ink-4);font-weight:600}
.roster{display:flex;flex-direction:column;gap:5px}
.ritem{
  display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center;
  padding:11px 11px;border-radius:13px;cursor:pointer;border:1px solid transparent;
  transition:background .15s,border-color .15s;
}
.ritem:hover{background:var(--card)}
.ritem.on{background:var(--card-2);border-color:var(--line-3)}
.ritem.on::before{content:"";position:absolute}
.rav{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;letter-spacing:-.02em;position:relative;
}
.rav i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg-2)}
.rmeta{min-width:0}
.rtop{display:flex;align-items:center;gap:7px}
.rname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--brand-faint);color:var(--brand-ink);letter-spacing:.04em;flex:none}
.rsub{display:flex;align-items:center;gap:6px;margin-top:3px}
.rstage{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.rbar>i{display:block;height:100%;border-radius:2px}

/* ── MAIN ── */
.main{min-width:0;padding:24px 30px 72px}
@media(max-width:1180px){.main{padding:22px 20px 60px}}

/* identity header */
.idcard{
  display:flex;gap:20px;align-items:flex-start;padding:22px 24px;border-radius:var(--r-xl);
  background:linear-gradient(135deg,rgba(64,32,224,.10),rgba(255,255,255,.02) 46%);
  border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden;
}
.idcard::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(244,98,42,.10),transparent 70%);pointer-events:none}
.idav{width:62px;height:62px;border-radius:17px;flex:none;display:grid;place-items:center;font-weight:700;font-size:24px;color:#fff;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.35)}
.idmain{flex:1;min-width:0}
.idname{font-family:var(--serif);font-size:32px;line-height:1;letter-spacing:.01em;margin-bottom:7px;text-wrap:balance}
.idmeta{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;color:var(--ink-3);font-size:12.5px}
.idmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.idmeta b{color:var(--ink-2);font-weight:600}
.idactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.idbadges{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill.good{background:var(--good-faint);color:var(--good)}
.pill.warn{background:var(--warn-faint);color:var(--warn)}
.pill.crit{background:var(--crit-faint);color:var(--crit)}
.pill.info{background:var(--info-faint);color:var(--info)}
.pill.brand{background:var(--brand-faint);color:var(--brand-ink)}
.pill.muted{background:rgba(255,255,255,.05);color:var(--ink-3)}
.pill.dotp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:15px 16px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line-2);position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--serif);font-size:27px;line-height:1.05;margin-top:9px;letter-spacing:.01em}
.kpi .val.mono{font-family:var(--mono);font-size:21px;font-weight:600}
.kpi .sub{font-size:11px;color:var(--ink-3);margin-top:4px}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}

/* journey spine */
.section-title{display:flex;align-items:center;gap:9px;margin:26px 2px 13px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600}
.section-title .ln{flex:1;height:1px;background:var(--line-2)}
.journey-wrap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:20px 8px 6px;overflow-x:auto}
.journey{display:flex;min-width:940px;padding:0 14px}
.jstep{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 3px}
.jstep .conn{position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line-3);z-index:0}
.jstep:first-child .conn{display:none}
.jstep.done .conn,.jstep.now .conn{background:linear-gradient(90deg,var(--good),var(--good))}
.jdot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;z-index:1;background:var(--bg-3);border:2px solid var(--line-3);font-size:12px;font-weight:700;color:var(--ink-4);position:relative}
.jstep.done .jdot{background:var(--good-faint);border-color:var(--good);color:var(--good)}
.jstep.now .jdot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 5px var(--orange-faint)}
.jstep.now .jdot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--orange);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.jlab{font-size:10.5px;line-height:1.25;margin-top:9px;color:var(--ink-3);max-width:96px;font-weight:500}
.jstep.done .jlab{color:var(--ink-2)}
.jstep.now .jlab{color:var(--ink);font-weight:600}
.jnum{font-size:9px;color:var(--ink-4);margin-top:3px;font-family:var(--mono)}

/* cards grid */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
@media(max-width:1080px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.chead{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.chead .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--card-2);flex:none}
.chead h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.chead .r{margin-left:auto;font-size:11px;color:var(--ink-3)}
.cbody{padding:16px 18px;display:flex;flex-direction:column;gap:13px}

/* generic rows / kv */
.kv{display:flex;flex-direction:column;gap:9px}
.kvr{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;align-items:baseline}
.kvr .k{color:var(--ink-3)}
.kvr .v{color:var(--ink);font-weight:500;text-align:right}
.prose{font-size:12.8px;line-height:1.62;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:8px;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2)}
.chip.flag{background:rgba(255,255,255,.04)}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);font-weight:600;margin-bottom:2px}

/* code block */
.codebox{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;background:linear-gradient(135deg,var(--brand-faint),transparent);border:1px solid var(--line-3)}
.codebox .cv{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.12em;color:var(--brand-ink)}
.codebox .cmeta{font-size:10.5px;color:var(--ink-3);line-height:1.4}
.copybtn{margin-left:auto;background:var(--card-2);border:1px solid var(--line-3);color:var(--ink-2);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.copybtn:hover{background:rgba(255,255,255,.1)}

/* tool + doc + pay rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:none}
.row .ico{width:22px;text-align:center;flex:none;opacity:.85}
.row .nm{font-size:12.6px;font-weight:500;min-width:0}
.row .nm small{display:block;font-size:10.5px;color:var(--ink-4);font-weight:400;margin-top:1px}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.row .rt .mono{font-size:11.5px;color:var(--ink-3)}

/* progress bar (deal) */
.pbar{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--good),#5EEAD4)}
.paywrap{display:flex;flex-direction:column;gap:7px}
.payhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.payhead b{font-family:var(--mono);font-size:15px;font-weight:700}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:grid;grid-template-columns:15px 1fr;gap:11px;padding-bottom:14px;position:relative}
.tli:last-child{padding-bottom:0}
.tli .rail-line{position:relative;display:flex;justify-content:center}
.tli .rail-line::before{content:"";position:absolute;top:4px;bottom:-14px;width:1.5px;background:var(--line-3)}
.tli:last-child .rail-line::before{display:none}
.tli .node{width:9px;height:9px;border-radius:50%;background:var(--brand-2);margin-top:3px;z-index:1;box-shadow:0 0 0 3px var(--bg-2)}
.tli.access .node{background:var(--orange)}
.tli .tc{min-width:0}
.tli .td{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);margin-bottom:1px}
.tli .tn{font-size:12.3px;color:var(--ink-2);line-height:1.45}
.tli .tch{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* checklist (milestones detail) */
.checks{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:22px 1fr auto;gap:11px;padding:11px 0;border-top:1px solid var(--line-2);align-items:start}
.ck:first-child{border-top:none}
.ckbox{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px;font-size:11px;border:1.5px solid var(--line-3);color:transparent}
.ck.done .ckbox{background:var(--good);border-color:var(--good);color:#04140d}
.ck.now .ckbox{border-color:var(--orange);background:var(--orange-faint);color:var(--orange)}
.ck .ct{font-size:12.6px;font-weight:500}
.ck.todo .ct{color:var(--ink-3)}
.ck .cn{font-size:11px;color:var(--ink-4);margin-top:2px;line-height:1.4}
.ck .cd{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap}
.ck.now .ct{color:var(--ink)}

/* next action banner */
.next{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--orange-faint);border:1px solid rgba(244,98,42,.28)}
.next .ni{font-size:18px;flex:none;margin-top:-1px}
.next .nt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--orange-2);font-weight:700}
.next .nb{font-size:13px;color:var(--ink);font-weight:500;margin-top:3px;line-height:1.45}
.next .nm2{font-size:11px;color:var(--ink-3);margin-top:5px}

/* empty state */
.empty{padding:20px 16px;text-align:center;border:1px dashed var(--line-3);border-radius:var(--r);color:var(--ink-3);font-size:12.3px;line-height:1.5}
.empty b{color:var(--ink-2);display:block;margin-bottom:3px;font-weight:600}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-4);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.foot .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}

/* mobile */
.rail-toggle{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:61px 0 auto 0;z-index:35;max-height:64vh;border-right:none;border-bottom:1px solid var(--line);transform:translateY(-115%);transition:transform .28s cubic-bezier(.16,1,.3,1)}
  .rail.open{transform:translateY(0)}
  .rail-toggle{display:inline-flex}
  .top-stats{display:none}
  .idname{font-size:26px}
  .idcard{flex-direction:column}
  .idbadges{flex-direction:row;flex-wrap:wrap;align-items:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <button class="btn btn-sm rail-toggle" id="railToggle" aria-label="Toggle client list">☰ Clients</button>
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-txt"><b>Client Gateway</b><span>Consultation → Passport · A–Z</span></div>
    </div>
    <div class="top-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search clients, programs, properties…" autocomplete="off">
    </div>
    <div class="top-stats">
      <div class="tstat"><b id="stat-active">—</b><span>In pipeline</span></div>
      <div class="tstat"><b id="stat-value">—</b><span>Portfolio</span></div>
    </div>
    <button class="btn btn-accent btn-sm" id="newBtn">＋ New client</button>
  </header>

  <!-- RAIL -->
  <aside class="rail" id="rail">
    <div class="rail-head"><h2>Clients</h2><b id="roster-count"></b></div>
    <div class="roster" id="roster"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="dossier"></main>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   NAC Client Gateway — consultant console
   Seeded from Notion (Lead CRM · Partners · KYC Intake · First-Call).
   Thao Ha = live record from the 2026-07-17 consultation.
   Two clients tagged ⟨Sample⟩ illustrate later A–Z stages.
   Wire to live data: set window.GW_DATA before this script, or
   fetch(WORKER_URL + '/api/clients').
   ════════════════════════════════════════════════════════════ */

const STAGES = [
  ["Consultation","First NAC meeting"],

/* ── helpers ── */
const $ = s => document.querySelector(s);
const money = (n,cur) => n==null ? "—" : new Intl.NumberFormat("en-US",{style:"currency",currency:cur||"USD",maximumFractionDigits:0}).format(n);
const initials = n => n.trim().split(/\s+/).slice(-2).map(w=>w[0]).join("").toUpperCase();
const grad = i => `linear-gradient(145deg,${AV[i%AV.length][1]},${AV[i%AV.length][0]})`;
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = (txt,tone,extra="") => `<span class="pill ${tone} ${extra}">${esc(txt)}</span>`;
const stageName = i => STAGES[i] ? STAGES[i][0] : "—";
const dotColor = tone => ({good:"var(--good)",warn:"var(--warn)",crit:"var(--crit)",info:"var(--info)",brand:"var(--brand-2)"}[tone]||"var(--ink-3)");

let ACTIVE = CLIENTS[0].id;

/* ── roster ── */
function renderRoster(filter=""){
  const f = filter.trim().toLowerCase();
  const list = CLIENTS.filter(c=>{
    if(!f) return true;
    return (c.name+" "+c.programs.join(" ")+" "+(c.property?.locked||"")+" "+c.programs.join("")).toLowerCase().includes(f);
  });
  $("#roster-count").textContent = list.length + (f?` / ${CLIENTS.length}`:"");
  $("#roster").innerHTML = list.map(c=>{
    const barCol = c.progress>=90?"var(--good)":c.progress>=45?"linear-gradient(90deg,var(--orange),var(--orange-2))":"linear-gradient(90deg,var(--brand-2),var(--brand-ink))";
    return `<div class="ritem ${c.id===ACTIVE?'on':''}" data-id="${c.id}" role="button" tabindex="0">
      <div class="rav" style="background:${grad(c.av)}">${initials(c.name)}<i style="background:${dotColor(c.status[1])}"></i></div>
      <div class="rmeta">
        <div class="rtop"><span class="rname">${esc(c.name)}</span>${c.sample?`<span class="rtag">SAMPLE</span>`:``}</div>
        <div class="rsub"><span class="rstage">§${c.stage+1} · ${esc(stageName(c.stage))}</span></div>
        <div class="rbar"><i style="width:${c.progress}%;background:${barCol}"></i></div>
      </div>
    </div>`;
  }).join("") || `<div class="empty" style="margin:8px">No match. <b></b>Try a program or property name.</div>`;
  document.querySelectorAll(".ritem").forEach(el=>{
    el.addEventListener("click",()=>select(el.dataset.id));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(el.dataset.id);}});
  });
}

function select(id){
  ACTIVE=id; renderRoster($("#search").value); renderDossier();
  $("#rail").classList.remove("open");
  $("#dossier").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ── dossier ── */
function renderDossier(){
  const c = CLIENTS.find(x=>x.id===ACTIVE); if(!c) return;
  const contactBits = [
    c.email?`<b>${esc(c.email)}</b>`:`<span style="color:var(--crit)">✎ no email on file</span>`,
    c.phone?`<b>${esc(c.phone)}</b>`:`<span style="color:var(--crit)">✎ no phone</span>`,
    esc(c.location)
  ].join('<span class="dot"></span>');

  const journey = STAGES.map((s,i)=>{
    const st = i<c.stage?"done":i===c.stage?"now":"todo";
    const mark = st==="done"?"✓":(i+1);
    return `<div class="jstep ${st}"><div class="conn"></div><div class="jdot">${mark}</div><div class="jlab">${esc(s[0])}</div><div class="jnum">§${i+1}</div></div>`;
  }).join("");

  $("#dossier").innerHTML = `
  <div class="idcard">
    <div class="idav" style="background:${grad(c.av)}">${initials(c.name)}</div>
    <div class="idmain">
      <div class="idname">${esc(c.name)}</div>
      <div class="idmeta">${contactBits}<span class="dot"></span>Advisor <b>${esc(c.advisor)}</b><span class="dot"></span>Source <b>${esc(c.source)}</b></div>
      <div class="idactions">
        ${c.email?`<a class="btn btn-sm" href="mailto:${esc(c.email)}">✉️ Email</a>`:`<button class="btn btn-sm" disabled>✉️ Email</button>`}
        ${c.phone?`<a class="btn btn-sm" href="https://wa.me/${c.phone.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">💬 WhatsApp</a>`:`<button class="btn btn-sm" disabled>💬 WhatsApp</button>`}
        <a class="btn btn-sm" href="https://calendar.app.google/owGkBM8Q5owKYwDd9" target="_blank" rel="noopener">📅 Book call</a>
        ${c.notion?`<a class="btn btn-sm" href="${esc(c.notion)}" target="_blank" rel="noopener">↗ Notion</a>`:``}
      </div>
    </div>
    <div class="idbadges">
      ${pill(c.status[0],c.status[1],"dotp")}
      ${pill("Appetite · "+c.appetite[0],c.appetite[1])}
      ${c.real?pill("Live record","brand"):pill("Sample data","muted")}
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="stripe" style="background:var(--orange)"></div><div class="lab">Current stage</div><div class="val" style="font-size:20px">§${c.stage+1} ${esc(stageName(c.stage))}</div><div class="sub">${esc(STAGES[c.stage][1])}</div></div>
    <div class="kpi"><div class="stripe" style="background:var(--good)"></div><div class="lab">Progress</div><div class="val">${c.progress}<span style="font-size:16px;color:var(--ink-3)">%</span></div><div class="sub">${c.stage} of ${STAGES.length} stages done</div></div>
    <div class="kpi"><div class="stripe" style="background:var(--brand-2)"></div><div class="lab">${c.deal?'Deal value':'Budget'}</div><div class="val mono">${money(c.deal?c.deal.price:c.budget,c.deal?c.deal.cur:c.cur)}</div><div class="sub">${c.deal?money(c.deal.paid,c.deal.cur)+' paid':'Target ticket'}</div></div>
    <div class="kpi"><div class="stripe" style="background:var(--warn)"></div><div class="lab">Next action</div><div class="val" style="font-size:15px;font-family:var(--sans);font-weight:600;line-height:1.3">${esc(c.next.due)}</div><div class="sub">${esc(c.next.owner)}</div></div>

      </div></div>
      <div><div class="lbl">Touchpoints</div><div class="tl">
        ${c.touch.map(t=>`<div class="tli ${t[3]?'access':''}"><div class="rail-line"><div class="node"></div></div><div class="tc"><div class="td">${esc(t[0])} · <span class="tch">${esc(t[1])}</span></div><div class="tn">${esc(t[2])}</div></div></div>`).join("")}
      </div></div>
    </div></div>`;
}
function cardDocs(c){
  const body = c.docs.length
    ? `<div class="rows">${c.docs.map(d=>`<div class="row"><span class="ico">${docIcon(d[1])}</span><span class="nm">${esc(d[0])}<small>${esc(d[1])}</small></span><span class="rt"><span class="mono">${esc(d[3])}</span>${pill(d[2][0],d[2][1])}</span></div>`).join("")}</div>`
    : `<div class="empty"><b>No documents yet</b>KYC intake, passport, proof of funds and certificates land here as the client submits them.</div>`;
  const verified = c.docs.filter(d=>['good'].includes(d[2][1])).length;
  return `<div class="card"><div class="chead"><div class="ic">📎</div><h3>Documents & submissions</h3><span class="r">${c.docs.length?`${verified}/${c.docs.length} cleared`:'0'}</span></div>
    <div class="cbody">${body}</div></div>`;
}
function docIcon(t){return {Identity:"🪪",Compliance:"🛡️",Legal:"📜",Dependents:"👪",Application:"🗳️",Outcome:"🎖️"}[t]||"📄";}
function cardMilestones(c){
  return `<div class="card wide"><div class="chead"><div class="ic">✅</div><h3>Milestones & next action</h3><span class="r">${c.stage}/${STAGES.length} complete</span></div>
    <div class="cbody">
      <div class="next"><div class="ni">➜</div><div><div class="nt">Next action · ${esc(c.next.due)}</div><div class="nb">${esc(c.next.body)}</div><div class="nm2">Owner: ${esc(c.next.owner)}</div></div></div>
      <div class="checks">
        ${STAGES.map((s,i)=>{const st=c.steps[i]?c.steps[i][0]:'todo';const dt=c.steps[i]?c.steps[i][1]:'—';const nt=c.steps[i]?c.steps[i][2]:'';
          return `<div class="ck ${st}"><div class="ckbox">${st==='done'?'✓':st==='now'?'●':''}</div><div><div class="ct">§${i+1} · ${esc(s[0])}</div>${nt?`<div class="cn">${esc(nt)}</div>`:``}</div><div class="cd">${esc(dt)}</div></div>`;
        }).join("")}
      </div>
    </div></div>`;
}

/* ── top stats ── */
function topStats(){
  const inPipe = CLIENTS.filter(c=>c.stage<11).length;
  const val = CLIENTS.reduce((s,c)=>s+(c.deal?c.deal.price* (c.cur==='EUR'?1.08:1):(c.budget||0)),0);
  $("#stat-active").textContent = inPipe;
  $("#stat-value").textContent = "$"+(val/1000).toFixed(0)+"K";
}

/* ── events ── */
document.addEventListener("click",e=>{
  const cp=e.target.closest("#copyCode");
  if(cp){const code=cp.dataset.code;navigator.clipboard?.writeText(code);const o=cp.textContent;cp.textContent="✓ Copied";setTimeout(()=>cp.textContent=o,1400);}
});
$("#search").addEventListener("input",e=>renderRoster(e.target.value));
$("#railToggle").addEventListener("click",()=>$("#rail").classList.toggle("open"));
$("#newBtn").addEventListener("click",()=>{
  alert("New-client intake opens the KYC form and creates a Lead CRM row.\n\n(Wired to the Notion Lead CRM + Partners DBs when connected to the Worker.)");
});

/* ── boot ── */
if(window.GW_DATA&&Array.isArray(window.GW_DATA)){CLIENTS.length=0;window.GW_DATA.forEach(x=>CLIENTS.push(x));ACTIVE=CLIENTS[0]?.id;}
renderRoster(); renderDossier(); topStats();
</script>
<!-- GW:ARTIFACT-END -->
</body>
</html>
